server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/menu {
        proxy_pass http://menu-api:8000/menu;
    }
    location /api/orders {
        proxy_pass http://orders-api:8080/orders;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
