apiVersion: apps/v1
kind: Deployment
metadata:
  name: menu-api
  namespace: staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: menu-api
  template:
    metadata:
      labels:
        app: menu-api
    spec:
      containers:
        - name: menu-api
          image: ghcr.io/muhammadyousafkhatana/dhaba-menu-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: DB_HOST
              value: postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: dhaba
            - name: DB_USER
              value: dhaba
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dhaba-db
                  key: password
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 384Mi
---
apiVersion: v1
kind: Service
metadata:
  name: menu-api
  namespace: staging
spec:
  selector:
    app: menu-api
  ports:
    - port: 8000
      targetPort: 8000
---
