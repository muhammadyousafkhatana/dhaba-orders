name: Build, publish and deploy staging

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - menu-api
          - orders-api
          - kitchen-worker
          - stats-api
          - web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: true
          tags: ghcr.io/muhammadyousafkhatana/dhaba-${{ matrix.service }}:latest
      - name: Verify deployment secrets are configured
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          test -n "$EC2_HOST" && echo "EC2_HOST configured" || { echo "EC2_HOST MISSING"; exit 1; }
          test -n "$EC2_USER" && echo "EC2_USER configured" || { echo "EC2_USER MISSING"; exit 1; }
          test -n "$EC2_SSH_KEY" && echo "EC2_SSH_KEY configured" || { echo "EC2_SSH_KEY MISSING"; exit 1; }

  deploy-staging:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy staging over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -e
            cd ~/dhaba-orders
            git fetch origin main
            git reset --hard origin/main
            kubectl apply -k k8s/overlays/staging
            for d in $(kubectl get deployments -n staging -o name); do
              kubectl rollout status "$d" -n staging --timeout=240s
            done
            kubectl get pods -n staging
